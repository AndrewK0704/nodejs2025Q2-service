version: '3.8'

services:
  node:
    image: node
    container_name: node
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run start:dev
    develop:
      watch:
        - action: rebuild
          path: ./src
    env_file: 
    - .env
    ports:
      - ${PORT}:${PORT}
    depends_on:
      - postgres
    volumes:
      - ./src:/app/src
      - /app/node_modules
    networks:
      - app_dev
    environment:
      - PORT=${PORT}
    restart: always

  postgres:
    image: postgres
    build:
      context: ./db
      dockerfile: Dockerfile
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - ${DB_PORT}:${DB_PORT}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_logs:/var/log/postgresql/postgresql.log
    networks:
      - app_dev
    restart: always

networks:
  app_dev:
    driver: bridge

volumes: 
  postgres_logs:
  postgres_data: